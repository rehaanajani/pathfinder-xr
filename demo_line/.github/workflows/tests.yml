name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only PyTorch, pinned versions)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install -r requirements.lock
      - name: Unit and regression tests (synthetic fixtures, no datasets needed)
        run: python -m pytest -q tests
      - name: Smoke benchmark (2 synthetic recordings, separate run folder)
        run: python evaluate.py --synthetic --seqs 2 --clip 30 --workers 2 --methods naive_fusion,ours_no_model --out runs/ci_smoke
